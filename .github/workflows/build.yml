name: Compilar y probar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar
        run: dotnet build InventarioSanMarcos.sln -c Release
      - name: Pruebas locales
        shell: pwsh
        run: |
          $result = Start-Process dotnet -ArgumentList @('src/InventarioSanMarcos/bin/Release/net10.0-windows/InventarioSanMarcos.dll', '--self-test') -Wait -PassThru -NoNewWindow
          Get-Content src/InventarioSanMarcos/bin/Release/net10.0-windows/pruebas.txt
          if ($result.ExitCode -ne 0) { exit $result.ExitCode }
      - name: Publicar Windows x64
        run: dotnet publish src/InventarioSanMarcos -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: InventarioSanMarcos-Windows-x64
          path: artifacts/windows-x64
